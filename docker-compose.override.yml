services:
  react-app:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: react-dev
    ports:
      - "5173:5173" # Vite 개발 서버 포트
    volumes:
      - ./Frontend/:/app # 코드 변경 사항을 컨테이너 내부에 즉시 반영
      - /app/node_modules # 로컬 node_modules와 분리하여 충돌 방지
    environment:
      - CHOKIDAR_USEPOLLING=true # 변경 사항 감지를 원활하게 설정

  java-app:
    # build:
    #   context: ./Backend/kidsnomy
    #   dockerfile: Dockerfile.test
    image: openjdk:17-jdk-alpine
    container_name: java-app
    volumes:
      - ./Backend/kidsnomy:/app
      - gradle-cache:/root/.gradle
    working_dir: /app
    entrypoint: ["sh", "-c", "./gradlew bootJar --no-daemon -x test && java -jar build/libs/kidsnomy-0.0.1-SNAPSHOT.jar"]
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kidsnomy?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ssafy
      SPRING_DATASOURCE_PASSWORD: ssafy

  mysql:
    image: mysql:8.0.40
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ssafy
      MYSQL_DATABASE: kidsnomy
      MYSQL_USER: ssafy
      MYSQL_PASSWORD: ssafy
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
  gradle-cache: