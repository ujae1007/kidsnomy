services:
  react-app:
    image: kwon0528/b207-react-app:0.1.0
    container_name: react-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /app/node_modules # 로컬 node_modules와 분리하여 충돌 방지
      - /home/ubuntu/kidsnomy/certs:/etc/letsencrypt:ro          # 인증서 및 키
    depends_on:
      - java-app


  java-app:
    # image: kwon0528/b207-java-app:0.1.0
    build: 
      context: ./Backend
    container_name: java-app
    volumes:
      # - ./Backend/kidsnomy:/app
      - gradle-cache:/root/.gradle
    working_dir: /app
    # entrypoint: ["sh", "-c", "./gradlew bootJar --no-daemon -x test && java -jar build/libs/kidsnomy-0.0.1-SNAPSHOT.jar"]
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kidsnomy?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ssafy
      SPRING_DATASOURCE_PASSWORD: ssafy
  
  fastapi-app:
    # image: kwon0528/b207-fastapi-app:0.1.0
    build: 
      context: AI
    ports:
      - "8000:8000"
    # volumes:
    #   - ./AI:/app
    # entrypoint: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - java-app

  mysql:
    image: kwon0528/b207-mysql:0.1.0
    environment:
      MYSQL_ROOT_PASSWORD: ssafy
      MYSQL_DATABASE: kidsnomy
      MYSQL_USER: ssafy
      MYSQL_PASSWORD: ssafy
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
  gradle-cache: